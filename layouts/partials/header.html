<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{ .Title }} | {{ .Site.Title }}</title>

        {{ if .Params.pagefind_searchbar_enabled }}
        <link href="/pagefind/pagefind-ui.css" rel="stylesheet">
        <script src="/pagefind/pagefind-ui.js"></script>
        <link rel="stylesheet" href={{ absURL "/css/pagefind.css" }} />
        {{ end }}

        <link rel="stylesheet" href={{ absURL "/css/style.css" }} />
        <link rel="stylesheet" href={{ absURL "/css/fonts.css" }} />
        {{ partial "head_custom.html" . }}
    </head>

    <body>
        <nav class="header">
            <div class="home">
                <a href={{ absURL "/" }}>HOME</a>
            </div>
            <div class="menu">
                <ul class="menu">
                    {{ range .Site.Menus.main }}
                    <li><a href={{ absURL .URL }}>{{ .Name }}</a></li>
                    {{ end }}
                </ul>
            </div>
        </nav>
